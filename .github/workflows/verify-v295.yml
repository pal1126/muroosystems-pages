name: Verify bilingual case navigation
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-v295.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v294 --pattern website.zip
          echo '60f4e7359bfebcba27c4592c7b1deac5a9461152a5030dcc1accaefe45a7cc39  website.zip' | sha256sum -c
          mkdir -p preview/muroosystems-pages
          unzip -q website.zip -d preview/muroosystems-pages
          cp assets/nuclear-cases*.js preview/muroosystems-pages/assets/
          cd preview/muroosystems-pages
          sha256sum -c <<'SUMS'
          3934387d32f84507f5c06df289a74223b2d17a8e711c2665fd47d766fc2bf143  assets/nuclear-cases-en.js
          f0a959332aabbec27aef51eb6695477240ad0b73041ec4596e05ae30d72df058  assets/nuclear-cases.js
          SUMS
      - name: Exercise mobile, tablet and desktop journeys
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m http.server 8793 --directory preview >/tmp/case-preview.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright, expect
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              for width in (390, 768, 1440):
                  for source, target in [('ja','en'), ('en','ja')]:
                      page = browser.new_page(viewport={'width':width,'height':900})
                      url = f'http://localhost:8793/muroosystems-pages/{source}/nuclear/cases/'
                      page.goto(url)
                      cards = page.locator('.nuclear-case:visible')
                      page.locator('#case-kind').select_option('all')
                      page.locator('#case-field').select_option('waste')
                      expect(cards).to_have_count(12)
                      page.locator('#case-more').click()
                      count = cards.count()
                      assert count > 12
                      page.reload()
                      expect(cards).to_have_count(count)
                      page.locator(f'footer a[hreflang="{target}"]').click()
                      expect(page.locator('#case-field')).to_have_value('waste')
                      expect(page.locator('#case-kind')).to_have_value('all')
                      expect(cards).to_have_count(count)
                      page.go_back()
                      expect(cards).to_have_count(count)
                      page.locator('#case-reset').click()
                      expect(cards).to_have_count(12)
                      page.goto(url + '#case-H16')
                      expect(page.locator('#case-H16 details')).to_have_attribute('open','')
                      page.locator(f'footer a[hreflang="{target}"]').click()
                      expect(page.locator('#case-H16 details')).to_have_attribute('open','')
                      assert page.evaluate('document.documentElement.scrollWidth <= innerWidth')
                      print(width, source, target, count, 'passed')
                      page.close()
          PY
      - name: Publish verified website archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm website.zip
          (cd preview/muroosystems-pages && zip -qr ../../website.zip .)
          gh release create v295 website.zip --target "$GITHUB_SHA" --title "Muroosystems corporate website · v295" --notes "Bilingual case filters, expanded results and case links persist during navigation."
