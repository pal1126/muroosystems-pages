name: Prepare v293 website release
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-v293.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Package validated corporate name update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v292 --pattern website.zip
          echo '6241ae0aea1e3a0e0fe8ee9ab08643e0654d1c3471172a8e3e8512a6cfe82267  website.zip' | sha256sum --check
          unzip -q website.zip -d public
          python - <<'PY'
          """Apply the corporate display name consistently to both published languages."""
          import re
          from pathlib import Path
          
          COMPANY_NAME = "NUKEM Technologies  GmbH"
          SPACE = r"(?:\s|\\n|\\r|&nbsp;)+"
          OLD_NAME = re.compile(
              rf"NUKEM{SPACE}Technologies{SPACE}Engineering{SPACE}Services?(?:{SPACE}GmbH)?",
              re.IGNORECASE,
          )
          OLD_ABBREVIATION = re.compile(r"(?<![A-Za-z0-9_])NTES(?![A-Za-z0-9_])")
          
          
          def update_company_name(directory: Path) -> None:
              for path in directory.rglob("*"):
                  if path.suffix not in {".html", ".js", ".json", ".xml", ".svg", ".txt", ".csv"}:
                      continue
                  previous = path.read_bytes()
                  text = previous.decode("utf-8")
                  updated = OLD_ABBREVIATION.sub("NUKEM", OLD_NAME.sub(COMPANY_NAME, text))
                  updated = updated.replace("nuclear engineering NUKEM NUKEM ", "nuclear engineering NUKEM ")
                  if updated != text:
                      path.write_bytes(updated.encode("utf-8"))
          
          import hashlib
          import zipfile
          root = Path("public")
          update_company_name(root)
          digest = hashlib.sha256()
          with zipfile.ZipFile("website.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      filename = path.relative_to(root).as_posix()
                      contents = path.read_bytes()
                      digest.update(filename.encode() + b"\0" + hashlib.sha256(contents).digest())
                      archive.writestr(filename, contents)
          assert digest.hexdigest() == "28b7aea326934f0d5c2ff281f0b41b3136747fa317cdf0e2c1531d104f40beaa"
          PY
          gh release create v293 website.zip --target "$GITHUB_SHA" --title "Muroosystems corporate website · v293" --notes "Updated the German group company’s name and abbreviation throughout the Japanese and English website."
