name: Publish Muroosystems website
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - assets/site-search*.js
      - 404.html
      - assets/search-excerpts.js
      - qa/**
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified static website
        run: |
          curl --fail --location --retry 3 --output website.zip https://github.com/pal1126/muroosystems-pages/releases/download/v296/website.zip
          echo '1f368fcc439bd548e84c513dc358996daddb9a030ef595ef032bbfb01fc42145  website.zip' | sha256sum --check
          unzip -q website.zip -d public
          test -s public/ja/index.html && test -s public/en/index.html
      - name: Apply and test bilingual search
        run: |
          cp 404.html public/404.html
          cp assets/site-search{,-en}.js assets/search-excerpts.js public/assets/
          mkdir -p "$RUNNER_TEMP/preview"
          ln -s "$GITHUB_WORKSPACE/public" "$RUNNER_TEMP/preview/muroosystems-pages"
          python -m http.server 8123 --directory "$RUNNER_TEMP/preview" > "$RUNNER_TEMP/preview.log" 2>&1 &
          npm install --prefix "$RUNNER_TEMP/search-qa" playwright@1.56.1
          cp qa/search-recovery.cjs "$RUNNER_TEMP/search-qa/"
          node "$RUNNER_TEMP/search-qa/search-recovery.cjs"
          python qa/update-contact.py
          python qa/section_links.py public
          python qa/sitemap_languages.py public https://pal1126.github.io/muroosystems-pages
          python qa/prepare_print.py public https://pal1126.github.io/muroosystems-pages
          python -m pip install Pillow==13.0.0
          python qa/responsive_hero.py public
          cp qa/home-hero.cjs "$RUNNER_TEMP/search-qa/"
          node "$RUNNER_TEMP/search-qa/home-hero.cjs"
          python qa/check-package.py
          command -v pdftotext || sudo apt-get install -y poppler-utils
          cp qa/print-pages.cjs "$RUNNER_TEMP/search-qa/"
          node "$RUNNER_TEMP/search-qa/print-pages.cjs"
          cp qa/visitor-journeys.cjs "$RUNNER_TEMP/search-qa/"
          node "$RUNNER_TEMP/search-qa/visitor-journeys.cjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the uploaded artifact to appear in the Actions API
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..20}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT_NAME"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live nested 404 and recovery destinations
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          base = os.environ["SITE_URL"].rstrip("/")
          url = f"{base}/missing/visitor-check/{os.environ['GITHUB_RUN_ID']}/"
          expected = Path("public/404.html").read_bytes()
          for attempt in range(12):
              try:
                  with urlopen(url, timeout=15) as response:
                      print("Unexpected HTTP status", response.status)
              except HTTPError as error:
                  if error.code == 404 and error.read() == expected:
                      print("Live nested URL returned HTTP 404 with the deployed bilingual page")
                      break
              except URLError as error:
                  print(error.reason)
              if attempt < 11:
                  time.sleep(5)
          else:
              raise SystemExit("Live bilingual 404 verification failed")
          from xml.etree import ElementTree as ET
          with urlopen(f"{base}/sitemap.xml?revision={os.environ['GITHUB_SHA']}", timeout=20) as response:
              tree = ET.parse(response)
          entries = tree.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url")
          assert entries
          for entry in entries:
              links = entry.findall("{http://www.w3.org/1999/xhtml}link")
              assert {link.get("hreflang") for link in links} == {"ja", "en", "x-default"}
          print("Live sitemap language clusters verified:", len(entries))
          for route in ("ja/", "ja/search/", "en/", "en/search/"):
              with urlopen(f"{base}/{route}", timeout=20) as response:
                  print(route, response.status)
                  if response.status != 200:
                      raise SystemExit("Recovery destination unavailable")
          PY
