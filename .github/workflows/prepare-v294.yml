name: Validate and package website v294
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-v294.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v293 --pattern website.zip
          echo '7738a2a6982c3eac644604e4b1377e3d0681f7dcc588fa874d36461a4ee70241  website.zip' | sha256sum --check
          unzip -q website.zip -d preview/muroosystems-pages
          unzip -oq update.zip -d preview/muroosystems-pages
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('preview/muroosystems-pages')
          digest = hashlib.sha256()
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  digest.update(path.relative_to(root).as_posix().encode() + b'\0' + hashlib.sha256(path.read_bytes()).digest())
          assert digest.hexdigest() == '8fd6978bb7f81127284bf9f7db02fc19035e2fcd2efaa27dbabee8f46f7e421e'
          PY
      - name: Check bilingual desktop, tablet and mobile journeys
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -m http.server 8793 --directory preview >/tmp/preview.log 2>&1 &
          python check-release.py
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm website.zip
          (cd preview/muroosystems-pages && zip -qr ../../website.zip .)
          gh release create v294 website.zip --target "$GITHUB_SHA" --title "Muroosystems corporate website · v294" --notes "Company profile navigation and bilingual search improvements."
